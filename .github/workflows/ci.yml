# ==================================================================
# Pipeline DevSecOps - Spring PetClinic
# Phases STRICTEMENT SEQUENTIELLES : chaque phase ne démarre que si
# la précédente est validée (fail-fast : contrôles rapides d'abord)
#
#  1 Pre-commit + messages   2 Secrets   3 Build/Tests   4 SAST
#  5 SCA   6 Qualité   7 SonarCloud   8 Docker build + scan image
#  9 DAST  10 Push Docker Hub  11 Deploy staging (Render)
#  12 Deploy prod simulée (conteneur local)
#  13 Notification (toujours, avec le résultat de chaque phase)
# ==================================================================
name: DevSecOps Pipeline

on:
  push:
    branches: ["**"] # à chaque push, sur toutes les branches
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # jamais d'annulation sur main : un déploiement pourrait être coupé
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Moindre privilège par défaut
permissions:
  contents: read
  security-events: write # upload SARIF -> onglet Security
  actions: read

env:
  IMAGE_NAME: mechket968/spring-petclinic
  TRIVY_IMAGE: aquasec/trivy:latest
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
  SEMGREP_RULES: --config p/java --config p/owasp-top-ten --config p/secrets
  PROD_CONTAINER: petclinic-prod
  PROD_PORT: "8081"

jobs:
  # ================================================================
  # PHASE 1 - PRE-COMMIT REJOUE COTE SERVEUR + MESSAGES DE COMMIT
  # Un développeur peut contourner ses hooks locaux (--no-verify) :
  # ici ils sont rejoués et NE PEUVENT PAS être contournés.
  # ================================================================
  precommit-check:
    name: Pre-commit & Commit Message
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Hooks pre-commit rejoués côté serveur (non contournables)
        env:
          SKIP: no-commit-to-branch # ce hook n'a de sens qu'en local
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Format des messages de commit (Conventional Commits)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          PATTERN='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{3,}'
          if [ "$EVENT" = "pull_request" ]; then
            RANGE="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            RANGE="$BEFORE..$GITHUB_SHA"
          elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
            RANGE="origin/main..$GITHUB_SHA"
          else
            RANGE="$GITHUB_SHA~1..$GITHUB_SHA"
          fi
          echo "Commits vérifiés : $RANGE"
          FAIL=0
          while IFS= read -r msg; do
            [ -z "$msg" ] && continue
            if echo "$msg" | grep -Eq "$PATTERN"; then
              echo "OK      : $msg"
            else
              echo "REFUSÉ  : $msg"
              FAIL=1
            fi
          done < <(git log --no-merges --format=%s "$RANGE")
          if [ "$FAIL" = "1" ]; then
            echo "Format attendu : type(scope): description  -> ex. fix(deps): montée de version tomcat"
            exit 1
          fi

  # ================================================================
  # PHASE 2 - SCAN DE SECRETS - Gitleaks (tout l'historique git)
  # ================================================================
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    needs: precommit-check
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo gitleaks/gitleaks --pattern '*_linux_x64.tar.gz' --output gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/
          rm gitleaks.tar.gz
          gitleaks version

      - name: Scan secrets (historique complet) - BLOQUANT
        run: gitleaks detect --source . --verbose --redact --report-format sarif --report-path gitleaks.sarif

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-gitleaks
          path: gitleaks.sarif
          if-no-files-found: ignore

  # ================================================================
  # PHASE 3 - BUILD + TESTS + COUVERTURE
  # ================================================================
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    needs: secret-scan
    permissions:
      contents: read
      pull-requests: write # commentaire de couverture sur les PR
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Build
        run: ./mvnw -B clean compile

      - name: Tests + couverture JaCoCo
        run: ./mvnw -B test jacoco:report

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: target/site/jacoco/

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: madrapps/jacoco-report@v1.6.1
        with:
          paths: target/site/jacoco/jacoco.xml
          token: ${{ secrets.GITHUB_TOKEN }}
          min-coverage-overall: 40
          min-coverage-changed-files: 60
          title: Code Coverage Report

  # ================================================================
  # PHASE 4 - SAST - Semgrep (bloquant sur sévérité ERROR)
  # ================================================================
  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Rapport complet (SARIF)
        run: semgrep scan $SEMGREP_RULES --sarif --output semgrep.sarif .

      - name: Upload SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-semgrep
          path: semgrep.sarif
          if-no-files-found: ignore

      - name: QUALITY GATE - sévérité ERROR = bloquant
        run: semgrep scan $SEMGREP_RULES --severity ERROR --error .

  # ================================================================
  # PHASE 5 - SCA - Trivy (bloquant sur CRITICAL/HIGH)
  # Cache Maven + --offline-scan : pas de requêtes Maven Central (429)
  # ================================================================
  dependency-scan:
    name: Dependency Scan (Trivy SCA)
    runs-on: ubuntu-latest
    needs: sast
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Remplir le cache Maven local
        run: ./mvnw -B dependency:go-offline

      - name: Rapports Trivy (SARIF, HTML, JSON)
        run: |
          mkdir -p reports
          TRIVY="docker run --rm -w /work -v $PWD:/work -v $HOME/.m2:/root/.m2 -v $HOME/.cache/trivy:/root/.cache/trivy $TRIVY_IMAGE"
          $TRIVY fs --scanners vuln --offline-scan --skip-dirs reports --format sarif --output reports/trivy-deps.sarif .
          $TRIVY fs --scanners vuln --offline-scan --skip-dirs reports --format template --template "@/contrib/html.tpl" --output reports/trivy-deps.html .
          $TRIVY fs --scanners vuln --offline-scan --skip-dirs reports --format json --output reports/trivy-deps.json .

      - name: Upload SARIF
        if: always() && hashFiles('reports/trivy-deps.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-deps.sarif
          category: trivy-dependencies

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-trivy-dependencies
          path: reports/

      - name: QUALITY GATE - CRITICAL/HIGH = bloquant
        run: |
          docker run --rm -w /work -v $PWD:/work -v $HOME/.m2:/root/.m2 -v $HOME/.cache/trivy:/root/.cache/trivy $TRIVY_IMAGE \
            fs --scanners vuln --offline-scan --skip-dirs reports --exit-code 1 --severity CRITICAL,HIGH .

  # ================================================================
  # PHASE 6 - QUALITE DE CODE - SpotBugs + PMD (informatif)
  # ================================================================
  quality-scan:
    name: Code Quality (SpotBugs + PMD)
    runs-on: ubuntu-latest
    needs: dependency-scan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: SpotBugs
        run: ./mvnw -B spotbugs:check
        continue-on-error: true

      - name: PMD
        run: ./mvnw -B pmd:check
        continue-on-error: true

  # ================================================================
  # PHASE 7 - SONARCLOUD - couverture + quality gate (bloquant)
  # ================================================================
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: quality-scan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Tests + couverture JaCoCo + analyse SonarCloud + quality gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: >
          ./mvnw -B test jacoco:report sonar:sonar
          -Dsonar.projectKey=mechket266_spring-devops
          -Dsonar.host.url=$SONAR_HOST_URL
          -Dsonar.organization=$SONAR_ORGANIZATION
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  # ================================================================
  # PHASE 8 - DOCKER BUILD + SCAN IMAGE + IaC + SBOM
  # ================================================================
  docker-build-scan:
    name: Docker Build + Image Scan
    runs-on: ubuntu-latest
    needs: sonarcloud
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (locale, non poussée)
        uses: docker/build-push-action@v5
        with:
          context: .
          load: true
          push: false
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan IaC (Dockerfile, docker-compose, k8s) - non bloquant
        run: docker run --rm -w /work -v $PWD:/work $TRIVY_IMAGE config --exit-code 0 .

      - name: Rapports image (SARIF, HTML, JSON) + SBOM CycloneDX
        run: |
          mkdir -p reports
          TRIVY="docker run --rm -w /work -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/work -v $HOME/.cache/trivy:/root/.cache/trivy $TRIVY_IMAGE"
          IMG="$IMAGE_NAME:$GITHUB_SHA"
          $TRIVY image --format sarif --output reports/trivy-image.sarif "$IMG"
          $TRIVY image --format template --template "@/contrib/html.tpl" --output reports/trivy-image.html "$IMG"
          $TRIVY image --format json --output reports/trivy-image.json "$IMG"
          $TRIVY image --format cyclonedx --output reports/sbom-cyclonedx.json "$IMG"

      - name: Upload SARIF
        if: always() && hashFiles('reports/trivy-image.sarif') != ''
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: reports/trivy-image.sarif
          category: trivy-image

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-trivy-image-sbom
          path: reports/

      - name: QUALITY GATE - CRITICAL avec correctif = bloquant
        run: |
          docker run --rm -w /work -v /var/run/docker.sock:/var/run/docker.sock -v $PWD:/work \
            -v $HOME/.cache/trivy:/root/.cache/trivy $TRIVY_IMAGE \
            image --exit-code 1 --severity CRITICAL --ignore-unfixed "$IMAGE_NAME:$GITHUB_SHA"

      - name: Export de l'image validée
        run: docker save "$IMAGE_NAME:$GITHUB_SHA" | gzip > image.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: docker-image
          path: image.tar.gz
          retention-days: 1

  # ================================================================
  # PHASE 9 - DAST - OWASP ZAP sur l'image exacte à déployer
  # ================================================================
  dast:
    name: DAST (OWASP ZAP)
    runs-on: ubuntu-latest
    needs: docker-build-scan
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image
        run: gunzip -c image.tar.gz | docker load

      - name: Démarrer l'application (config staging)
        run: |
          docker run -d --name app -p 8080:8080 \
            -e SPRING_H2_CONSOLE_ENABLED=false \
            "$IMAGE_NAME:$GITHUB_SHA"

      - name: Attendre le démarrage
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8080; then echo "App prête"; exit 0; fi
            echo "attente app... ($i)"; sleep 5
          done
          docker logs app
          exit 1

      - name: ZAP baseline scan
        run: |
          mkdir -p zap && chmod 777 zap
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" $ZAP_IMAGE \
            zap-baseline.py -t http://localhost:8080 -a \
            -r zap-report.html -J zap-report.json -w zap-report.md -I || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-zap
          path: zap/

      - name: Logs de l'application
        if: failure()
        run: docker logs app

  # ================================================================
  # PHASE 10 - PUSH DOCKER HUB (main uniquement) - tags SHA + latest
  # ================================================================
  docker-push:
    name: Push Docker Hub
    runs-on: ubuntu-latest
    needs: dast
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: docker-image

      - name: Charger l'image validée
        run: |
          gunzip -c image.tar.gz | docker load
          docker tag "$IMAGE_NAME:$GITHUB_SHA" "$IMAGE_NAME:latest"

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

  # ================================================================
  # PHASE 11 - DEPLOIEMENT STAGING (Render) + SMOKE TEST
  # ================================================================
  deploy-staging:
    name: Deploy Staging (Render)
    runs-on: ubuntu-latest
    needs: docker-push
    environment:
      name: staging
      url: ${{ vars.RENDER_APP_URL }}
    steps:
      - name: Déployer l'image du commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMG: docker.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
        run: |
          ENC=$(python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['IMG'], safe=''))")
          curl -fsS -X POST "${HOOK}&imgURL=${ENC}" > /dev/null
          echo "Déploiement de $IMG déclenché"

      - name: Smoke test (app répond + endpoints sensibles fermés)
        env:
          URL: ${{ vars.RENDER_APP_URL }}
        run: |
          sleep 120
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null "$URL"; then echo "Staging OK"; break; fi
            [ "$i" = "30" ] && { echo "Staging KO"; exit 1; }
            echo "attente déploiement... ($i)"; sleep 20
          done
          FAIL=0
          for path in /h2-console /actuator/env /actuator/heapdump /actuator/loggers; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL$path")
            echo "$path -> HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "ERREUR : $path exposé"; FAIL=1; fi
          done
          exit $FAIL

  # ================================================================
  # PHASE 12 - DEPLOIEMENT PRODUCTION SIMULEE (conteneur local)
  # Runner self-hosted sur la machine de démo (Docker Desktop)
  # Ancien conteneur arrêté -> nouveau démarré -> health check
  # -> succès : suppression ancien conteneur + ancienne image
  # -> échec  : ROLLBACK automatique vers l'ancienne version
  # ================================================================
  deploy-production:
    name: Deploy Production (conteneur local)
    runs-on: [self-hosted, Windows]
    needs: deploy-staging
    environment:
      name: production
      url: http://localhost:8081
    steps:
      - name: 1. Récupérer la nouvelle image validée
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $image = "$($env:IMAGE_NAME):$($env:GITHUB_SHA)"
          Write-Host "Nouvelle image : $image"
          docker pull $image
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: 2. Arrêter l'ancien conteneur (conservé pour rollback)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $name = $env:PROD_CONTAINER
          $old  = "$name-old"
          docker container inspect $old *> $null
          if ($LASTEXITCODE -eq 0) { docker rm -f $old | Out-Null }
          docker container inspect $name *> $null
          if ($LASTEXITCODE -eq 0) {
            $oldImage = docker inspect --format '{{.Config.Image}}' $name
            Write-Host "Conteneur en service : $name (image $oldImage)"
            docker stop $name | Out-Null
            docker rename $name $old
            Write-Host "Ancien conteneur ARRETE et renommé en $old"
          } else {
            Write-Host "Aucun conteneur en service : premier déploiement"
          }
          exit 0

      - name: 3. Créer et démarrer le nouveau conteneur
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $image = "$($env:IMAGE_NAME):$($env:GITHUB_SHA)"
          docker run -d --name $env:PROD_CONTAINER `
            -p "$($env:PROD_PORT):8080" `
            -e SPRING_H2_CONSOLE_ENABLED=false `
            --restart unless-stopped `
            $image
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Write-Host "Nouveau conteneur $($env:PROD_CONTAINER) démarré"

      - name: 4. Health check + contrôles de sécurité
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $base = "http://localhost:$($env:PROD_PORT)"
          $ok = $false
          for ($i = 1; $i -le 36; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $base -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Write-Host "attente de l'application... ($i)"
            Start-Sleep -Seconds 5
          }
          if (-not $ok) { Write-Host "Application KO"; docker logs $env:PROD_CONTAINER; exit 1 }
          Write-Host "Application OK sur $base"
          $fail = $false
          foreach ($p in @('/h2-console', '/actuator/env', '/actuator/heapdump')) {
            $code = 0
            try { $code = (Invoke-WebRequest -Uri "$base$p" -UseBasicParsing -TimeoutSec 10 -Method Head).StatusCode }
            catch { if ($_.Exception.Response) { $code = [int]$_.Exception.Response.StatusCode } }
            Write-Host "$p -> HTTP $code"
            if ($code -eq 200) { Write-Host "ERREUR : $p exposé"; $fail = $true }
          }
          if ($fail) { exit 1 }
          exit 0

      - name: 5. Supprimer l'ancien conteneur et l'ancienne image
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $old      = "$($env:PROD_CONTAINER)-old"
          $newImage = "$($env:IMAGE_NAME):$($env:GITHUB_SHA)"
          docker container inspect $old *> $null
          if ($LASTEXITCODE -eq 0) {
            $oldImage = docker inspect --format '{{.Config.Image}}' $old
            docker rm -f $old | Out-Null
            Write-Host "Ancien conteneur SUPPRIME : $old"
            if ($oldImage -and $oldImage -ne $newImage) {
              docker rmi $oldImage | Out-Null
              Write-Host "Ancienne image SUPPRIMEE : $oldImage"
            }
          }
          docker image prune -f | Out-Null
          Write-Host ""
          Write-Host "=== Etat après déploiement ==="
          docker ps --filter "name=petclinic" --format "table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}"
          docker images $env:IMAGE_NAME
          exit 0

      - name: ROLLBACK - restaurer l'ancienne version
        if: failure() || cancelled()
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $name = $env:PROD_CONTAINER
          $old  = "$name-old"
          docker rm -f $name *> $null
          docker container inspect $old *> $null
          if ($LASTEXITCODE -eq 0) {
            docker rename $old $name
            docker start $name | Out-Null
            Write-Host "ROLLBACK effectué : l'ancienne version est de nouveau en service"
          } else {
            Write-Host "Pas de version précédente : rien à restaurer"
          }
          exit 0

  # ================================================================
  # PHASE 13 - NOTIFICATION (à chaque run, succès ou échec)
  # Résultat de chaque phase -> Slack + résumé GitHub
  # ================================================================
  notify:
    name: Notification
    runs-on: ubuntu-latest
    needs:
      [
        precommit-check,
        secret-scan,
        build-test,
        sast,
        dependency-scan,
        quality-scan,
        sonarcloud,
        docker-build-scan,
        dast,
        docker-push,
        deploy-staging,
        deploy-production,
      ]
    if: always()
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      NEEDS: ${{ toJSON(needs) }}
      GLOBAL: ${{ (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) && 'ECHEC' || 'SUCCES' }}
    steps:
      - name: Rapport du pipeline (Slack + résumé GitHub)
        run: |
          icon() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⛔" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❔" ;;
            esac
          }
          PHASES="precommit-check|1. Pre-commit & messages de commit
          secret-scan|2. Scan de secrets (Gitleaks)
          build-test|3. Build & tests
          sast|4. SAST (Semgrep)
          dependency-scan|5. SCA dépendances (Trivy)
          quality-scan|6. Qualité (SpotBugs + PMD)
          sonarcloud|7. SonarCloud (quality gate)
          docker-build-scan|8. Docker build + scan image
          dast|9. DAST (OWASP ZAP)
          docker-push|10. Push Docker Hub
          deploy-staging|11. Déploiement staging (Render)
          deploy-production|12. Déploiement prod (conteneur)"

          REPORT=""
          ROWS=""
          while IFS='|' read -r id label; do
            id=$(echo "$id" | xargs)
            res=$(echo "$NEEDS" | jq -r --arg j "$id" '.[$j].result // "n/a"')
            REPORT+="$(icon "$res") $label : $res"$'\n'
            ROWS+="| $label | $(icon "$res") $res |"$'\n'
          done <<< "$PHASES"

          if [ "$GLOBAL" = "SUCCES" ]; then
            TITLE="✅ Pipeline DevSecOps RÉUSSI"
          else
            TITLE="🚨 Pipeline DevSecOps EN ÉCHEC"
          fi
          RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

          MSG="*$TITLE*
          Dépôt : $GITHUB_REPOSITORY  |  Branche : $GITHUB_REF_NAME
          Commit : ${GITHUB_SHA::7} par $GITHUB_ACTOR ($GITHUB_EVENT_NAME)

          $REPORT
          Détails : $RUN_URL"

          {
            echo "## $TITLE"
            echo ""
            echo "Branche \`$GITHUB_REF_NAME\` - commit \`${GITHUB_SHA::7}\` par $GITHUB_ACTOR"
            echo ""
            echo "| Phase | Résultat |"
            echo "|---|---|"
            printf "%s" "$ROWS"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            jq -n --arg text "$MSG" '{text: $text}' | \
              curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
            echo "Notification Slack envoyée"
          else
            echo "Secret SLACK_WEBHOOK_URL absent : notification Slack ignorée"
          fi
