# Contrôles exécutés en local AVANT chaque commit (shift-left)
# Installation : pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks              # bloque le commit si un secret est détecté

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: detect-private-key    # clés privées (RSA, SSH...)
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
        args: ['--allow-multiple-documents']   # manifestes k8s multi-documents
